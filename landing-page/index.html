<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tapetarija Alekom — Novi Sad. Novi sajt uskoro. Tapaciranje, restauracija i šivenje po meri.">
  <title>Alekom — Uskoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__photo"></div>
    <div class="atmosphere__wash"></div>
    <div class="atmosphere__grain"></div>
  </div>

  <main class="stage">
    <p class="eyebrow reveal" style="--delay: 0ms">Tapetarija · Petrovaradin</p>

    <h1 class="brand reveal" style="--delay: 80ms">Alekom</h1>

    <svg class="stitch reveal" style="--delay: 180ms" viewBox="0 0 220 12" fill="none" aria-hidden="true">
      <path class="stitch__path" d="M2 6 Q 28 2 55 6 T 110 6 T 165 6 T 218 6" stroke-linecap="round"/>
    </svg>

    <h2 class="headline reveal" style="--delay: 260ms">Uskoro</h2>

    <p class="lede reveal" style="--delay: 340ms">
      Novi sajt je u pripremi. Do tada — pozovite nas.
    </p>

    <div class="contact reveal" style="--delay: 420ms">
      <a class="phone" href="tel:+381216433621">021 64 33 621</a>
      <span class="dot" aria-hidden="true"></span>
      <a class="phone" href="tel:+381642496345">064 24 96 345</a>
    </div>

    <a class="instagram reveal" style="--delay: 500ms" href="https://instagram.com/tapetarijaalekom" target="_blank" rel="noopener noreferrer">
      @tapetarijaalekom
    </a>
  </main>

  <footer class="footer reveal" style="--delay: 580ms">
    <span>Tunislava Paunovića 24, Petrovaradin</span>
    <span>Novi Sad · © <span id="year">2026</span></span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
