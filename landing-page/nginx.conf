server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

server {
    listen 80;
    listen [::]:80;
    server_name www.tapetarijaalekom.rs;

    return 308 https://tapetarijaalekom.rs$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tapetarijaalekom.rs localhost _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
