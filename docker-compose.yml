services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://tapetarijaalekom.rs
        NEXT_PUBLIC_ALLOW_INDEXING: "true"
        NEXT_PUBLIC_CONTACT_FORM_ENABLED: "true"
        NEXT_PUBLIC_SHOW_DEMO_PROJECTS: ${NEXT_PUBLIC_SHOW_DEMO_PROJECTS:-true}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}


    environment:
      NEXT_PUBLIC_SITE_URL: https://tapetarijaalekom.rs
      NEXT_PUBLIC_ALLOW_INDEXING: "true"
      NEXT_PUBLIC_CONTACT_FORM_ENABLED: "true"
      NEXT_PUBLIC_SHOW_DEMO_PROJECTS: ${NEXT_PUBLIC_SHOW_DEMO_PROJECTS:-true}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}

    expose:
      - "3000"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped
